services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-servario}
      POSTGRES_USER: ${POSTGRES_USER:-servario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-servario}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: servario/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      SERVARIO_LICENSE_KEY: ${SERVARIO_LICENSE_KEY:-}
      SERVARIO_LICENSE_SERVER_URL: ${SERVARIO_LICENSE_SERVER_URL:-}
      SERVARIO_INSTANCE_ID: ${SERVARIO_INSTANCE_ID:-}
      SERVARIO_LICENSE_OFFLINE_GRACE_DAYS: ${SERVARIO_LICENSE_OFFLINE_GRACE_DAYS:-30}
    volumes:
      - servario_data:/data
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: servario/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    networks:
      - internal
    depends_on:
      - backend

  proxy:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - internal
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  servario_data:
  npm_data:
  npm_letsencrypt:

networks:
  internal:
    driver: bridge
