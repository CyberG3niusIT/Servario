<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block subject %}{{ subject }}{% endblock %}</title>
  <style>
    body { margin: 0; padding: 0; background: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #18181b; }
    .wrapper { max-width: 560px; margin: 32px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .header { background: #1d4ed8; padding: 28px 32px; }
    .header h1 { margin: 0; font-size: 20px; color: #ffffff; font-weight: 600; }
    .header p { margin: 4px 0 0; font-size: 13px; color: #bfdbfe; }
    .body { padding: 32px; }
    .body h2 { margin: 0 0 8px; font-size: 17px; font-weight: 600; }
    .body p { margin: 0 0 16px; font-size: 15px; line-height: 1.6; color: #3f3f46; }
    .detail-box { background: #f8fafc; border: 1px solid #e4e4e7; border-radius: 6px; padding: 20px; margin: 20px 0; }
    .detail-row { display: flex; gap: 12px; margin-bottom: 10px; font-size: 14px; }
    .detail-row:last-child { margin-bottom: 0; }
    .detail-label { color: #71717a; min-width: 110px; flex-shrink: 0; }
    .detail-value { color: #18181b; font-weight: 500; }
    .footer { padding: 20px 32px; border-top: 1px solid #f4f4f5; }
    .footer p { margin: 0; font-size: 12px; color: #a1a1aa; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>{{ business_name }}</h1>
      <p>Terminverwaltung</p>
    </div>
    <div class="body">
      {% block body %}{% endblock %}
    </div>
    <div class="footer">
      <p>Diese E-Mail wurde automatisch von {{ business_name }} versandt. Bitte nicht antworten.</p>
    </div>
  </div>
</body>
</html>
